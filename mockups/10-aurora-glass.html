<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>10 · Aurora Glass — Evicted</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Azeret+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ------------------------------------------------------------------
     DIRECTION 10 — AURORA GLASS (the magicui/aceternity lane, restrained)
     This is the flashy lane done on purpose, not by reflex. One deep
     ink-teal ground, ONE slow aurora behind the hero, ONE glass card.
     The discipline: colour comes only from the aurora, glass is barely
     there, and there is exactly one gradient in the whole page. Type:
     Sora + Azeret Mono. Motion: a slow-drifting aurora blob. Signature:
     the aurora read through frosted glass.
     ------------------------------------------------------------------ */
  :root{--bg:#05080c;--glass:rgba(255,255,255,.045);--stroke:rgba(255,255,255,.12);
    --fg:#eaf1f4;--dim:#8fa2ad;--mint:#6ff2c5;--violet:#9b8cff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font-family:"Sora",sans-serif;
    min-height:100vh;overflow-x:hidden;position:relative}
  .aurora{position:fixed;top:-20%;left:50%;transform:translateX(-50%);
    width:820px;height:620px;filter:blur(90px);opacity:.5;z-index:0;pointer-events:none;
    background:
      radial-gradient(closest-side at 30% 40%,#1f8a6b,transparent),
      radial-gradient(closest-side at 70% 30%,#5b4bd6,transparent),
      radial-gradient(closest-side at 55% 70%,#0e6f8f,transparent);
    animation:drift 16s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translateX(-50%) translateY(40px) scale(1.08) rotate(8deg)}}
  .wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:26px 20px 80px}
  header{display:flex;justify-content:space-between;align-items:center}
  .logo{font-weight:800;font-size:20px;letter-spacing:-.01em}
  .logo b{color:var(--mint)}
  nav{display:flex;gap:18px}
  nav a{font-family:"Azeret Mono";font-size:11px;text-transform:uppercase;letter-spacing:.05em;
    text-decoration:none;color:var(--dim)}
  nav a.on{color:var(--fg)}
  .kick{font-family:"Azeret Mono";font-size:11px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--mint);text-align:center;margin:60px 0 10px}
  h1{text-align:center;font-size:20px;font-weight:600;color:var(--dim)}
  .glass{margin-top:26px;background:var(--glass);border:1px solid var(--stroke);
    border-radius:22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    padding:30px 26px;box-shadow:0 30px 60px -30px rgba(0,0,0,.8)}
  .subject{text-align:center}
  .subject .n{font-size:96px;font-weight:800;line-height:.85;
    background:linear-gradient(180deg,#fff,var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
  .subject .nl{font-family:"Azeret Mono";font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  .subject .t{font-size:26px;font-weight:700;margin-top:18px}
  .subject .m{color:var(--dim);font-size:13px;margin-top:4px}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:26px}
  .row div{background:rgba(255,255,255,.03);border:1px solid var(--stroke);border-radius:14px;padding:14px;text-align:center}
  .row .l{font-family:"Azeret Mono";font-size:10px;text-transform:uppercase;color:var(--dim);letter-spacing:.05em}
  .row .v{font-size:24px;font-weight:700;margin-top:4px}
  .quip{text-align:center;font-size:14px;color:var(--dim);font-style:italic;margin-top:22px}
  .pay{display:block;text-align:center;margin-top:22px;text-decoration:none;
    font-family:"Azeret Mono";font-size:13px;letter-spacing:.06em;text-transform:uppercase;
    color:#05221a;background:linear-gradient(90deg,var(--mint),#7fe0ff);
    padding:15px;border-radius:14px;font-weight:500}
  .pot{text-align:center;font-family:"Azeret Mono";font-size:11px;color:var(--dim);
    margin-top:18px;letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>
  <div class="aurora"></div>
  <div class="wrap">
    <header>
      <div class="logo">ev<b>·</b>icted</div>
      <nav><a class="on" href="#">This week</a><a href="#">Season</a><a href="#">Balances</a><a href="#">Draft</a></nav>
    </header>

    <p class="kick">Gameweek 6 · Settled</p>
    <h1>Bottom of the week</h1>

    <div class="glass">
      <div class="subject">
        <div class="n">31</div>
        <div class="nl">net points</div>
        <div class="t">Vardy Party</div>
        <div class="m">Danny Rose · owes &pound;2</div>
      </div>
      <div class="row">
        <div><div class="l">Team</div><div class="v">35</div></div>
        <div><div class="l">Hits</div><div class="v">&minus;4</div></div>
        <div><div class="l">Bench</div><div class="v">12</div></div>
      </div>
      <p class="quip">&ldquo;Second week running. The sofa has your shape now.&rdquo;</p>
      <a class="pay" href="#">Pay &pound;2 &rarr;</a>
    </div>

    <p class="pot">Pot &pound;84.00 · 7 of 12 bought in</p>
  </div>
</body>
</html>
