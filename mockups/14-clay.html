<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>14 · Soft Clay — Evicted</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600&display=swap" rel="stylesheet" />
<style>
  /* ------------------------------------------------------------------
     DIRECTION 14 — SOFT CLAY (neumorphism, disciplined)
     Warm putty ground, extruded soft shapes, one terracotta accent.
     Neumorphism's failure is illegible ghost controls; here contrast is
     kept real (text always on solid), and the soft dual-shadow is used
     only on containers, never on text. Type: Nunito (rounded) + Nunito
     Sans. Layout: pill nav, one big rounded slab, inset stat wells.
     Motion: button presses inward. Signature: matched light/dark dual
     shadows for a moulded, tactile surface.
     ------------------------------------------------------------------ */
  :root{--clay:#e9e4da;--clay-hi:#fbf8f2;--clay-lo:#cfc7b8;--ink:#3f3a33;--dim:#8f887c;
    --terra:#d2683f;--terra-lo:#b0532f}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--clay);color:var(--ink);font-family:"Nunito Sans",sans-serif}
  .wrap{max-width:520px;margin:0 auto;padding:26px 20px 80px}
  header{display:flex;justify-content:space-between;align-items:center}
  .logo{font-family:"Nunito";font-weight:900;font-size:22px;color:var(--ink)}
  .logo b{color:var(--terra)}
  nav{display:flex;gap:4px;background:var(--clay);padding:5px;border-radius:16px;
    box-shadow:inset 3px 3px 7px var(--clay-lo),inset -3px -3px 7px var(--clay-hi)}
  nav a{font-family:"Nunito";font-weight:700;font-size:11px;text-decoration:none;color:var(--dim);
    padding:6px 10px;border-radius:11px}
  nav a.on{color:var(--terra);background:var(--clay);
    box-shadow:3px 3px 6px var(--clay-lo),-3px -3px 6px var(--clay-hi)}
  .kick{font-family:"Nunito";font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--terra);margin:32px 0 12px;text-align:center}
  .slab{background:var(--clay);border-radius:30px;padding:32px 28px;text-align:center;
    box-shadow:9px 9px 20px var(--clay-lo),-9px -9px 20px var(--clay-hi)}
  .disc{width:110px;height:110px;border-radius:50%;margin:0 auto 18px;background:var(--clay);
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 6px 6px 12px var(--clay-lo),inset -6px -6px 12px var(--clay-hi)}
  .disc span{font-family:"Nunito";font-weight:900;font-size:44px;color:var(--terra)}
  .team{font-family:"Nunito";font-weight:800;font-size:28px}
  .mgr{color:var(--dim);font-size:14px;margin-top:4px}
  .wells{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px}
  .well{background:var(--clay);border-radius:18px;padding:14px 6px;
    box-shadow:inset 4px 4px 9px var(--clay-lo),inset -4px -4px 9px var(--clay-hi)}
  .well .l{font-family:"Nunito";font-weight:700;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
  .well .v{font-family:"Nunito";font-weight:900;font-size:26px;margin-top:2px}
  .quip{font-size:14px;font-style:italic;color:var(--dim);margin-top:24px;padding:0 8px}
  .pay{display:inline-block;margin-top:24px;font-family:"Nunito";font-weight:800;font-size:15px;
    text-decoration:none;color:#fff;background:linear-gradient(180deg,var(--terra),var(--terra-lo));
    padding:15px 40px;border-radius:16px;box-shadow:5px 5px 12px var(--clay-lo),-5px -5px 12px var(--clay-hi);
    transition:box-shadow .08s,transform .08s}
  .pay:active{box-shadow:inset 4px 4px 9px var(--terra-lo);transform:translateY(1px)}
  .pot{text-align:center;margin-top:22px;font-family:"Nunito";font-weight:700;font-size:13px;color:var(--dim)}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">ev<b>·</b>icted</div>
      <nav><a class="on" href="#">Week</a><a href="#">Season</a><a href="#">Balances</a><a href="#">Draft</a></nav>
    </header>

    <p class="kick">Gameweek 6 · Bottom of the week</p>

    <div class="slab">
      <div class="disc"><span>31</span></div>
      <div class="team">Vardy Party</div>
      <div class="mgr">Danny Rose · net points · owes &pound;2</div>

      <div class="wells">
        <div class="well"><div class="l">Team</div><div class="v">35</div></div>
        <div class="well"><div class="l">Hits</div><div class="v">&minus;4</div></div>
        <div class="well"><div class="l">Bench</div><div class="v">12</div></div>
      </div>

      <p class="quip">&ldquo;Second week running. The sofa has your shape now.&rdquo;</p>
      <a class="pay" href="#">Pay &pound;2</a>
    </div>

    <p class="pot">Pot &pound;84.00 · 7 of 12 bought in</p>
  </div>
</body>
</html>
